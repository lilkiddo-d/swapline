[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# FFI is used only by test/RealizedRateReference.t.sol to call the TypeScript reference implementation.
ffi = true
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/src/config" },
  { access = "read", path = "./test/vectors" },
]

[fuzz]
runs = 512
seed = "0x5741504c"

[invariant]
runs = 64
depth = 48
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
localfork = "http://127.0.0.1:18546"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false

# Contract verification. Etherscan v2 officially supports Robinhood Chain (https://api.etherscan.io/v2/chainlist ->
# chainid 4663, explorer robin.etherscan.io). Needs a free ETHERSCAN_API_KEY; Blockscout is the keyless fallback.
[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api?chainid=4663" }
